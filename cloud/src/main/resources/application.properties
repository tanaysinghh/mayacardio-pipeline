spring.application.name=pipeline-cloud
spring.main.banner-mode=off
server.port=${PORT:8080}
server.shutdown=graceful
spring.mvc.async.request-timeout=600000
cloud.storage=${CLOUD_STORAGE:sqlite}
cloud.sqlite.path=${CLOUD_SQLITE_PATH:./cloud-data/cloud.db}
cloud.jdbc.url=${CLOUD_JDBC_URL:}
cloud.jdbc.user=${CLOUD_JDBC_USER:}
cloud.jdbc.password=${CLOUD_JDBC_PASSWORD:}
cloud.jdbc.pool=${CLOUD_JDBC_POOL:4}
cloud.api.token=${CLOUD_API_TOKEN:}
logging.level.root=WARN
logging.level.com.mayacardio=INFO
logging.level.org.springframework.boot.web.embedded=INFO
logging.level.org.springframework.boot.tomcat=INFO
