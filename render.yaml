services:
  - type: web
    name: mayacardio-pipeline-cloud
    runtime: docker
    plan: free
    dockerfilePath: ./docker/cloud/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: CLOUD_STORAGE
        value: postgres
      - key: CLOUD_JDBC_URL
        sync: false
      - key: CLOUD_API_TOKEN
        generateValue: true
      - key: CLOUD_JDBC_POOL
        value: "3"
      - key: PIPELINE_INTERPRET_ROUNDING
        value: half_even
      - key: PIPELINE_INTERPRET_HR_MISSING
        value: sensor1
      - key: PIPELINE_INTERPRET_RESULTS_LAYOUT
        value: flat
      - key: PIPELINE_INTERPRET_EMPTY_WINDOWS
        value: report
      - key: PIPELINE_INTERPRET_PARTIAL_FINAL_WINDOW
        value: report
